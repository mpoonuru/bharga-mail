[package]
name = "bharga-mail"
version = "0.1.4"
license = "AGPL-3.0-only"
description = "AI-native, model-agnostic, local-first mail client"
authors = ["Arjun P"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "bharga_mail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
# Self-update from GitHub Releases (signed with our minisign key) + relaunch.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Local-first store (bundled SQLite — compiles its own libsqlite3, FTS5 enabled)
rusqlite = { version = "0.32", features = ["bundled"] }
# OAuth (PKCE) + secure token storage
tiny_http = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
# Authenticated encryption (AES-256-GCM) for secrets at rest in the DB fallback;
# the 32-byte master key lives in the OS keychain (see sync/tokens.rs).
aes-gcm = "0.10"
urlencoding = "2"
# keyring v3 needs an explicit platform backend feature (mock elsewhere, e.g. Linux CI)
keyring = { version = "3", features = ["apple-native", "windows-native"] }
open = "5"
chrono = { version = "0.4", features = ["serde"] }
# SMTP send for IMAP/SMTP accounts (rustls — no system OpenSSL needed)
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
# IMAP inbox fetch (rustls TLS) + RFC822 parsing
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
mailparse = "0.16"
# Robust HTML→text (html5ever parser) for the HTML fallback when an email has no
# text/plain part — handles malformed Outlook/Word markup, <style>/<script>,
# MSO conditional comments, and entity decoding correctly.
html2text = "0.12"
# Calendar domain and interoperability. Versions are pinned to preserve the
# project's Rust 1.77 minimum while the calendar core is introduced.
icalendar = { version = "=0.17.6", features = ["parser", "chrono-tz"] }
rrule = { version = "=0.14.0", features = ["serde"] }
chrono-tz = "=0.10.4"
quick-xml = { version = "=0.39.4", features = ["serialize"] }
uuid = { version = "=1.11.0", features = ["v4", "serde"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
