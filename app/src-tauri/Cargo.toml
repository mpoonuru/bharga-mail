[package]
name = "bharga-mail"
version = "0.2.2"
license = "AGPL-3.0-only"
description = "AI-native, model-agnostic, local-first mail client"
authors = ["Arjun P"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "bharga_mail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
# Self-update from GitHub Releases (signed with our minisign key) + relaunch.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
# Local-first store (bundled SQLite — compiles its own libsqlite3, FTS5 enabled)
rusqlite = { version = "0.41", features = ["bundled"] }
# OAuth (PKCE) + secure token storage
tiny_http = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.10"
# Authenticated encryption (AES-256-GCM) for secrets at rest in the DB fallback;
# the 32-byte master key lives in the OS keychain (see sync/tokens.rs).
aes-gcm = "0.10"
urlencoding = "2"
# keyring v4 auto-selects its platform backend at runtime (no compile-time features)
keyring = "4"
open = "5"
chrono = { version = "0.4", features = ["serde"] }
# SMTP send for IMAP/SMTP accounts (rustls — no system OpenSSL needed)
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
# IMAP inbox fetch (rustls TLS) + RFC822 parsing
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
# Same crate `imap` already pulls in; a direct dep lets us match the server's RFC 6154
# SPECIAL-USE attributes (\\Sent, \\Drafts, …) instead of guessing roles from names.
imap-proto = "0.16"
mailparse = "0.16"
# Robust HTML→text (html5ever parser) for the HTML fallback when an email has no
# text/plain part — handles malformed Outlook/Word markup, <style>/<script>,
# MSO conditional comments, and entity decoding correctly.
html2text = "0.12"
# Calendar domain and interoperability. Versions are pinned for stability while
# the calendar core is introduced (MSRV is 1.85 now that the crate is on edition 2024).
icalendar = { version = "=0.17.6", features = ["parser", "chrono-tz"] }
rrule = { version = "=0.14.0", features = ["serde"] }
chrono-tz = "=0.10.4"
quick-xml = { version = "=0.39.4", features = ["serialize"] }
uuid = { version = "=1.11.0", features = ["v4", "serde"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"

# macOS only: build the main window's WKWebViewConfiguration ourselves (see
# src/webview_tuning.rs). Same crates and versions Tauri/wry already compile;
# no new packages.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebViewConfiguration", "WKPreferences"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
