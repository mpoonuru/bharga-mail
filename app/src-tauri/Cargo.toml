[package]
name = "aether-mail"
version = "0.1.0"
description = "AI-native, model-agnostic, local-first mail client"
authors = ["PJ Telesoft"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "aether_mail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Local-first store (bundled SQLite — compiles its own libsqlite3, FTS5 enabled)
rusqlite = { version = "0.32", features = ["bundled"] }
# OAuth (PKCE) + secure token storage
tiny_http = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
urlencoding = "2"
# keyring v3 needs an explicit platform backend feature (mock elsewhere, e.g. Linux CI)
keyring = { version = "3", features = ["apple-native", "windows-native"] }
open = "5"
chrono = { version = "0.4", features = ["serde"] }
# SMTP send for IMAP/SMTP accounts (rustls — no system OpenSSL needed)
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
# IMAP inbox fetch (rustls TLS) + RFC822 parsing
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
mailparse = "0.16"

[features]
custom-protocol = ["tauri/custom-protocol"]
