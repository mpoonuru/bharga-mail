name: CI

# Verifies both halves of the app on every push/PR:
#  - frontend: typecheck + Vite build
#  - Rust core: fmt, clippy, cargo check, unit tests
# (The Rust core was authored without a local toolchain, so this is the gate
#  that confirms it compiles — see README.)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx tsc -b
      - run: bun run test
      - run: bun run build

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      # Advisory (don't block the build on style):
      - run: cargo fmt --all -- --check
        continue-on-error: true
      - run: cargo clippy --all-targets
        continue-on-error: true
      # Hard gates:
      - run: cargo check --all-targets
      - run: cargo test
