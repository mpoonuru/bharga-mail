name: Release

# Builds installers for macOS (Apple Silicon + Intel), Windows and Linux and
# attaches them to a GitHub Release. Free on public repos. Triggered by pushing
# a version tag, e.g.  git tag v0.1.1 && git push origin v0.1.1
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-latest,   target: aarch64-apple-darwin, args: "--target aarch64-apple-darwin" }
          - { platform: macos-latest,   target: x86_64-apple-darwin,  args: "--target x86_64-apple-darwin" }
          - { platform: ubuntu-22.04,   target: "",                   args: "" }
          - { platform: windows-latest, target: "",                   args: "" }
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libayatana-appindicator3-dev

      - name: Install frontend dependencies
        working-directory: app
        run: bun install

      - name: Build and publish to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free ad-hoc signing on macOS (no paid Apple Developer account). Users
          # remove the Gatekeeper quarantine via the install script / Homebrew.
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Bharga Mail ${{ github.ref_name }}"
          releaseBody: "Free download. See the README for install notes — on macOS run the install script (or right-click → Open); this build is ad-hoc signed, not notarized."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
